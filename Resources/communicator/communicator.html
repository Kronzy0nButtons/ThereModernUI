<!DOCTYPE html>
<!-- ThereModernUI - communicator.html. Author: DANKIES. Based on There Edge by hmphus (MIT) -->
<html lang="en-US">
<head>
<title>Communicator</title>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<meta name="version" content="3.1">
<meta name="author" content="Makena2 Mods">
<link rel="stylesheet" type="text/css" href="communicator2.css">
<script src="../js/jquery-3.5.1.min.js"></script>
<script src="../js/framework.js"></script>
<script src="../tmui/update.js"></script>
<script src="communicator2.js"></script>
</head>
<body>
<div class="communicator" data-state="full" data-view="people" data-cockpit="checking">
<div class="cockpitgate">
<div class="cgcard">
<div class="cgtitle">Waiting for the There client&#8230;</div>
<div class="cgstatus">Connecting over the Client Bridge</div>
</div>
</div>
<div class="titlebar">
<div class="title">
<span class="name">People</span>
<span class="count"></span>
</div>
<div class="buttons">
<div class="button" data-id="help" title="Help">?</div>
<div class="button" data-id="bar" title="Collapse">&#8211;</div>
<div class="button" data-id="full" title="Expand">+</div>
<div class="button" data-id="close" title="Close">&#10005;</div>
</div>
</div>
<div class="search">
<input type="text" placeholder="Search people&#8230;" spellcheck="false">
<div class="clear" title="Clear">&#10005;</div>
</div>
<div class="controls">
<label class="toggle"><input type="checkbox" data-id="offline" checked> Show offline</label>
<select class="sort" data-id="sort">
<option value="folders">Folders</option>
<option value="name">A to Z</option>
<option value="status">Status</option>
</select>
<div class="button sync" data-id="sync" title="Copy server folders and their people into your folders">&#8635;</div>
</div>
<div class="items"></div>
<div class="footer">
<div class="button primary only-people" data-id="buddy">+ Add Buddy</div>
<div class="button only-people" data-id="organize">Organize</div>
<div class="button only-organize" data-id="buddy2">+ Add</div>
<div class="button only-organize" data-id="newfolder">+ Folder</div>
<div class="button primary only-organize" data-id="done">Done</div>
</div>
<div class="contextmenu" data-active="0"></div>
<div class="grip" title="Drag to resize"></div>
<div class="toast" data-active="0"></div>
<div class="overlay" data-active="0" data-dialog="addbuddy">
<div class="dialog" data-id="addbuddy">
<div class="title">Add a Buddy</div>
<input type="text" placeholder="Avatar name" spellcheck="false" maxlength="32">
<div class="status" data-state="idle"></div>
<div class="buttons">
<div class="button" data-id="cancel">Cancel</div>
<div class="button primary" data-id="add" data-enabled="0">Add</div>
</div>
</div>
<div class="dialog" data-id="folder">
<div class="title">New Folder</div>
<input type="text" placeholder="Folder name" spellcheck="false" maxlength="24">
<div class="status" data-state="idle"></div>
<div class="buttons">
<div class="button" data-id="cancel">Cancel</div>
<div class="button primary" data-id="ok" data-enabled="0">OK</div>
</div>
</div>
<div class="dialog" data-id="move">
<div class="title">Move</div>
<div class="list"></div>
<div class="buttons">
<div class="button" data-id="stockorg" title="Server folders are edited in the stock Organizer">Server&#8230;</div>
<div class="button" data-id="cancel">Cancel</div>
</div>
</div>
</div>
</div>
</body>
</html>
